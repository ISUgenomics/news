# Global settings. Profiles overlay this file; a profile states only what differs.
# Secrets are named here as ${VAR} and resolved from the environment at load time.
# Nothing in this file is itself secret.

db: data/items.db

smtp:
  host: mailhub.iastate.edu
  port: 25

delivery:
  # The line every brief carries in its footer, so a reader can forward the
  # page without vouching for it personally. It names an organization, which is
  # a fact about this deployment and not about the code — a profile may override
  # it. Keep the "links to its source" half: it is what the citation rule buys.
  provenance: >-
    Prepared automatically by the bioinformatics facility at Iowa State
    University from public sources; every statement links to its source.

llm:
  # local | claude-cli | codex-cli | anthropic-api
  #
  # `local` is the default because it asks nothing of anyone: no credential, no
  # token expiry, and no question about whether an unattended weekly job is a
  # permitted use of a coding-CLI subscription. Switching is one line here, or
  # per profile.
  provider: local

  # Name the model. Do NOT rely on auto-selection: it picks the largest model at
  # or under 15B, a rule tuned for interactive apps that need first tokens in
  # seconds. This is a weekly batch job where two minutes is free and quality is
  # everything, so the 3B model that rule chooses is the wrong trade.
  model: qwen3.8:27b-mlx

  # base_url: http://localhost:11434   # local only; a GPU box elsewhere

  # The window the packer is allowed to fill. The vendored provider caps its
  # DISCOVERED value at 32768; this model declares 262144 and Ollama runs it at
  # that size, so the window CAN be raised. Measured, it should not be:
  #
  #   32768 -> 21 of 59 items sent, 12 entries, 3 minutes
  #   65536 -> 59 of 59 items sent, 34 entries, 1534 words, 17 minutes
  #
  # The 600-word limit, not the context window, is what bounds a one-page
  # brief. Feeding the model everything did not make it choose better, it made
  # it write more — two and a half times the length limit, five times the time.
  # "43 of 59 items never reach the model" was the wrong problem statement: a
  # one-page digest holds about a dozen entries however many candidates it sees.
  # The real question is whether the best dozen are among the 21, which is a
  # RANKING question, not a context one.
  #
  # Left commented rather than deleted: raise it if the length limit is ever
  # enforced in code rather than asked for in the prompt.
  # context_window: 65536
  timeout_s: 1800                      # a 27B model takes minutes, not seconds

  # Reproducibility, as far as it goes. Ollama defaults to temperature 0.8 and a
  # fresh random seed, so without these the same prompt returns materially
  # different text every run — measured: two calls invented two different award
  # titles. With them, measured over six runs of the real prompt: five were
  # byte-identical and the sixth differed by one punctuation mark.
  #
  # So this buys "stable, not bit-identical". Metal/MLX reduction order varies
  # with GPU scheduling, so a near-tie between two tokens can still flip. What
  # stayed constant across all six runs was everything that matters: the amount,
  # the PI, the citation, the claim. Do not promise byte-identical briefs; do
  # expect a diff between two runs to show a real change rather than resampling.
  # Set `seed: null` for variety.
  seed: 42
  temperature: 0

  # How long the server holds the model after a request. The default is five
  # minutes; a backfill that pauses between weeks can lose an 18 GB model in the
  # gap and pay tens of seconds to reload it. Local provider only.
  keep_alive: 30m

select:
  chars_per_token: 4            # budgeting heuristic; no provider exposes a tokenizer
  output_reserve_tokens: 4000
  prompt_overhead_tokens: 1500
  # Per-item cap on the text sent to the model. This caps the RENDERED item —
  # the body plus a short header carrying source, date, title and URL — not the
  # body alone, so it must exceed ingest.body_cap_bytes below by enough to cover
  # that header or the longest items are cut by a few hundred characters.
  #
  # Now that storage keeps whole articles, THIS is the binding cap and it is a
  # measured trade rather than a round number. On a 32k-context model, against
  # one real week of 86 items:
  #
  #     cap  9,216  ->  16 sent, 3 truncated, 0 dropped
  #     cap 16,000  ->  16 sent, 1 truncated, 0 dropped
  #     cap 24,000  ->  16 sent, 1 truncated, 0 dropped   <- here
  #     cap 50,000  ->  14 sent, 0 truncated, 2 DROPPED
  #
  # Past ~24k a single 49k-character awards listing eats half the budget and
  # crowds two whole items out of the brief. Truncating one long article beats
  # losing two items outright, so this stops short of that cliff. A
  # 100k-context provider has room for 50,000 and drops nothing; raise it there.
  max_item_chars: 24000

  # How old an item may be and still count as news in the WEEKLY run. The live
  # window is "fetched in the last 7 days", which means an award we only just
  # learned about is news even if the agency posted it a month ago — that is
  # deliberate. But a deep historical ingest fetches years of awards in one
  # afternoon, and without this bound the next brief fills with awards from
  # 2024. Backfill ignores it entirely: it selects by publication date already.
  max_item_age_days: 90

ingest:
  silent_source_days: 14        # alert when a source has produced nothing for this long
  # Storage cap, applied by db.py when the row is written, so it is permanent
  # for rows already stored. Raising it only affects future fetches — and a page
  # whose body was previously cut will hash differently once it is stored in
  # full, so it arrives as a NEW row alongside the old one and the model sees
  # both. Raise it only if you also mean to clear the affected rows.
  #
  # Raised from 8192 after measuring what that cost: a real awards article ran to
  # 49,331 characters and only 8,188 were kept, losing 83% of exactly the content
  # a brief is looking for. Storage is not the scarce resource here — the spec
  # budgets a few hundred items a week staying under 100 MB for years — so this
  # keeps what was fetched and lets select.max_item_chars decide what a given
  # model can actually be shown.
  body_cap_bytes: 65536
