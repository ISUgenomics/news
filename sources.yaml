# Every source, declared once. Profiles reference these by name and may override
# parameters inline. A source used identically by five profiles is fetched once.
#
# `kind` names the adapter in src/brief/sources/. `verify: true` marks a URL that has
# NOT been confirmed against a live fetch. It is documentation today, not a runtime
# check — nothing reads it yet, so treat a flagged source as known-unreliable.

inside_isu:
  kind: rss
  # Drupal, and it declares no feed anywhere in the page — found by probing the
  # standard Drupal paths. Rejects a default Python User-Agent with "Request
  # Rejected"; the browser UA the feed adapter sends gets through. Sends no
  # ETag or Last-Modified, so every poll is a full fetch and dedup does the work.
  url: "https://www.inside.iastate.edu/rss.xml"

isu_research_news:
  kind: rss
  url: "https://research.iastate.edu/feed/"   # WordPress; sends ETag, so an unchanged poll is a 304

isu_news_service:
  kind: rss
  # Same Drupal setup as inside_isu; /rss also works but /rss.xml is canonical.
  url: "https://www.news.iastate.edu/rss.xml"

changedetection:
  kind: rss
  url: "http://changedetection:5000/rss?token=${CD_TOKEN}"

# bioRxiv subject feeds. The path is `biorxiv_xml.php?subject=<slug>`; the
# `/biorxiv_xml/<slug>` form that used to sit here 404s, which is what the old
# `verify: true` flag was warning about. Both below were fetched and checked.
#
# NONE of these carry an author affiliation, so they cannot be filtered to an
# institution. For a campus brief use `openalex`, which indexes bioRxiv AND
# attaches the institution — five bioRxiv preprints already arrive that way.
# These are for TOPIC profiles, where the whole world is the point.
biorxiv_all:
  kind: rss
  # Every subject. Measured 2026-09-17: 30 entries, ALL from a single day —
  # bioRxiv publishes far more than that, so this is a few-hours window and a
  # daily poll silently misses most of it. Prefer a subject feed unless you
  # are polling many times a day and accept the gaps.
  url: "http://connect.biorxiv.org/biorxiv_xml.php?subject=all"

biorxiv_bioinformatics:
  kind: rss
  # Measured the same day: 30 entries spanning 3 days, so a daily poll covers
  # it with room to spare. The lower the volume, the further 30 entries reach.
  url: "http://connect.biorxiv.org/biorxiv_xml.php?subject=bioinformatics"

biorxiv_plant_biology:
  kind: rss
  url: "http://connect.biorxiv.org/biorxiv_xml.php?subject=plant_biology"

nih_guide:
  kind: rss
  url: "https://grants.nih.gov/grants/guide/newsfeed/fundingopps.xml"

pubmed_search:
  kind: pubmed                  # query set per profile; uses E-utilities esearch + esummary
  email: "severin@iastate.edu" # NCBI asks callers to identify themselves

openalex:
  kind: openalex                # institution + date window; `institution` set per profile
  # The polite-pool contact OpenAlex asks for. Not a secret; it buys the
  # faster, more reliable pool and is required rather than optional.
  mailto: "severin@iastate.edu"

crates_io:
  kind: crates                  # `query` and `sort` set per profile
  # crates.io's crawler policy asks callers to identify themselves with a
  # contact. Not a secret; the seed refuses a UA without one.
  user_agent: "topic-brief (mailto:severin@iastate.edu)"

nsf:
  kind: nsf                     # awardee | keyword | pi_name set per profile

nih:
  kind: nih                     # org_names | advanced_text_search set per profile

usaspending:
  kind: usaspending             # recipient set per profile
